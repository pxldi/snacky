<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Snacky{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="site">
   <div class="bar">
    <span class="brand">Snacky</span>
    <nav aria-label="Hauptmenü">
      <a href="/"{% if nav_current == "day" %} aria-current="page"{% endif %}>Heute</a>
      <a href="/week"{% if nav_current == "week" %} aria-current="page"{% endif %}>Woche</a>
      <a href="/quick"{% if nav_current == "quick" %} aria-current="page"{% endif %}>Schnell</a>
    </nav>
   </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site">
    <p>Nährwerte aus Bundeslebensmittelschlüssel 4.0, Max Rubner-Institut, CC BY 4.0, und Open Food Facts, ODbL.</p>
  </footer>
</body>
</html>
