# Release notes for each GitHub Release, written by git-cliff from Conventional Commits.
# release.yml runs `git cliff --current`: the commits between the previous tag and the one being
# released. Only what a user of Snacky would notice is listed.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
# Merge commits and anything else that is not a Conventional Commit stay out. CI rejects
# unconventional subjects on pull requests, so in practice that is only GitHub's merge commits.
filter_unconventional = true
split_commits = false
# A breaking change is listed whatever its type.
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
# The HTML comments only order the groups; they are stripped from the headings.
commit_parsers = [
  # git-cliff sets `breaking` for both a `!` after the type and a BREAKING CHANGE footer.
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^(docs|ci|build|chore|refactor|test|style|revert)", skip = true },
]

[bump]
# The first release is v0.1.0. Before 1.0.0 a feature bumps the minor and a
# breaking change bumps the minor too, so the major stays 0 until decided by hand.
initial_tag = "v0.1.0"
features_always_bump_minor = true
breaking_always_bump_major = false
